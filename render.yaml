services:
  - type: web
    name: pusat-games-buddhis
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    disk:
      name: sqlite-data
      mountPath: /app/data
      sizeGB: 1
